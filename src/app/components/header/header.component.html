<div class="scroll-progress" [style.transform]="'scaleX(' + scrollProgress() + ')'"></div>

<header
  class="fixed top-0 left-0 right-0 z-40 transition-all duration-300"
  [class.scrolled]="scrolled()">
  <nav class="container-custom flex items-center justify-between py-4">
    <a href="#home" class="logo group inline-flex items-center gap-3">
      <span class="logo-mark">
        <span class="logo-mark-inner font-mono text-sm font-bold">HS</span>
      </span>
      <span class="hidden sm:inline font-mono text-sm tracking-tight">
        <span class="text-[var(--c-text-muted)]">~/</span><span class="text-gradient font-semibold">himmanshu</span>
        <span class="cursor"></span>
      </span>
    </a>

    <ul class="hidden lg:flex items-center gap-8">
      <li *ngFor="let item of navItems">
        <a [href]="'#' + item.id"
           class="nav-link"
           [class.active]="activeSection() === item.id">
          {{ item.label }}
        </a>
      </li>
    </ul>

    <div class="flex items-center gap-3">
      <a href="assets/doc/HimmanshuSharmaResume.pdf" target="_blank"
         class="hidden md:inline-flex btn-ghost border border-soft hover:border-strong">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        resume.pdf
      </a>

      <button (click)="toggleTheme()" class="theme-btn" [attr.aria-label]="isDark() ? 'Light mode' : 'Dark mode'">
        <svg *ngIf="!isDark()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg *ngIf="isDark()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>

      <button (click)="toggleMobileMenu()" class="lg:hidden theme-btn" aria-label="Menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          <path *ngIf="isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M6 18L18 6"/>
        </svg>
      </button>
    </div>
  </nav>

  <div class="lg:hidden mobile-panel" [class.open]="isMobileMenuOpen()">
    <ul class="px-6 py-6 space-y-1 border-t border-soft bg-elevated">
      <li *ngFor="let item of navItems">
        <a [href]="'#' + item.id" (click)="closeMenu()"
           class="block py-3 font-mono text-sm hover:text-[var(--c-accent)] transition-colors"
           [class.text-primary-400]="activeSection() === item.id">
          <!-- <span class="text-[var(--c-text-dim)] mr-2">0{{ item.id.length }}.</span>{{ item.label }} -->
          <span class="text-[var(--c-text-dim)] mr-2"></span>{{ item.label }}
        </a>
      </li>
      <li>
        <a href="assets/doc/HimmanshuSharmaResume.pdf" target="_blank"
           class="block py-3 font-mono text-sm text-primary-400">→ resume.pdf</a>
      </li>
    </ul>
  </div>
</header>
