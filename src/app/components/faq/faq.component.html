<section id="faq" class="section-padding relative overflow-hidden bg-soft">
  <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-primary-500/40 to-transparent"></div>

  <div class="container-custom relative">
    <div class="grid lg:grid-cols-12 gap-12 items-start">
      <div class="lg:col-span-5 lg:sticky lg:top-32">
        <p class="faq-eyebrow section-eyebrow">08 — FAQ</p>
        <h2 class="faq-title section-title-xl mb-5">
          Common <span class="text-gradient">questions</span>.
        </h2>
        <p class="faq-subtitle text-lg text-[var(--c-text-muted)] leading-relaxed mb-6">
          Quick answers on availability, stack and how we'd collaborate.
        </p>
        <a href="#contact" class="btn-outline inline-flex">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          Ask something else
        </a>
      </div>

      <div class="lg:col-span-7 space-y-3">
        <div *ngFor="let item of faqs; let i = index"
             class="faq-item card"
             [class.open]="openIdx() === i">
          <button (click)="toggle(i)" class="faq-toggle">
            <span class="font-mono text-xs text-primary-300 mr-3">0{{ i + 1 }}.</span>
            <span class="flex-1 text-left font-display font-medium text-[var(--c-text)]">{{ item.q }}</span>
            <span class="faq-chev">
              <svg class="w-5 h-5 transition-transform duration-300" [class.rotate-45]="openIdx() === i"
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
            </span>
          </button>
          <div class="faq-body" [class.open]="openIdx() === i">
            <p class="text-[var(--c-text-muted)] leading-relaxed pb-5 px-6">{{ item.a }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
