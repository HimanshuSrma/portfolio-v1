<section id="process" class="section-padding relative overflow-hidden">
  <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-primary-500/40 to-transparent"></div>
  <div class="absolute inset-0 grid-backdrop opacity-30 pointer-events-none"></div>

  <div class="container-custom relative">
    <div class="max-w-3xl mb-16">
      <p class="process-eyebrow section-eyebrow">06 — Process</p>
      <h2 class="process-title section-title-xl mb-5">
        How an idea becomes <span class="text-gradient">production code</span>.
      </h2>
      <p class="process-subtitle text-lg text-[var(--c-text-muted)] leading-relaxed">
        A five-step loop refined over four years of shipping flagship products. Always iterative, always measurable.
      </p>
    </div>

    <div class="process-grid">
      <div *ngFor="let s of steps; let i = index; let last = last" class="process-step">
        <div class="step-badge font-mono">{{ s.step }}</div>

        <div class="step-card card p-6 lg:p-7">
          <div class="flex items-center gap-3 mb-3">
            <span class="step-icon">
              <svg *ngIf="i === 0" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <svg *ngIf="i === 1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h10M4 18h10"/></svg>
              <svg *ngIf="i === 2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
              <svg *ngIf="i === 3" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <svg *ngIf="i === 4" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </span>
            <h3 class="font-display font-semibold text-xl text-[var(--c-text)]">{{ s.title }}</h3>
          </div>
          <p class="text-[var(--c-text-muted)] leading-relaxed">{{ s.description }}</p>
        </div>

        <div *ngIf="!last" class="step-connector" aria-hidden="true">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
        </div>
      </div>
    </div>
  </div>
</section>
